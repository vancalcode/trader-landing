name: Deploy to GitHub Pages

# 这个工作流有两个作用：
# 1. 用 configure-pages 的 enablement:true **自动开启 Pages**
#    （否则必须有人去 Settings → Pages 手动点一下开关）
# 2. 每次 push 自动把站点重新发布一遍
#
# ⚠️ 刻意**不写** job 级的 environment:
#    GitHub 自动创建 `github-pages` 环境时，把分支白名单写成了字面量 "None"
#    （不是默认分支名），导致 `main` 在启动阶段就被 "environment protection rules"
#    拒掉、0 个步骤执行。不声明 environment 就不会走那条校验。
#    代价：Actions 页面不会显示部署环境的 URL 徽章，功能无影响。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement: true —— 仓库没开 Pages 时由工作流代为开启
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 只发布站点需要的文件，别把 .git / .github 一起塞进产物
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          echo "--- 待发布内容 ---"
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
