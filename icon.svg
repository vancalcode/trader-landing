<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 19 64 64" width="64" height="64">
  <!--
    训练台图标 —— 三根 K 线，与 App 的
    trader-android/app/src/main/res/drawable/ic_launcher_foreground.xml 同源。

    ⚠️ 这个文件是**唯一来源**：既当浏览器 favicon（<link rel="icon">），
    也是落地页顶部那个大图标（<img class="icon">）。改图标只改这里。

    圆角方块底色用 #1B212C（Palette 的 panelRaised），比 App 图标的
    #141821 亮一档 —— 因为落地页背景是更深的 #0D1117，用 #141821 会糊在一起。
  -->
  <rect x="22" y="19" width="64" height="64" rx="15" fill="#1B212C"/>
  <g stroke-linecap="round" stroke-width="3.5" fill="none">
    <path d="M34,38 L34,72" stroke="#2ED3A0"/>
    <path d="M54,30 L54,78" stroke="#FF6B81"/>
    <path d="M74,26 L74,62" stroke="#2ED3A0"/>
  </g>
  <rect x="29" y="46" width="10" height="18" fill="#2ED3A0"/>
  <rect x="49" y="38" width="10" height="32" fill="#FF6B81"/>
  <rect x="69" y="34" width="10" height="22" fill="#2ED3A0"/>
</svg>
