<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<!-- 分享预览。og:url 故意不写死：本页与部署位置解耦，写死会指到错的地方。 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="训练台">
<meta property="og:title" content="训练台 · Android 下载">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="训练台 · Android 下载">
<meta name="twitter:description" content="用真实历史行情练交易。逐日推进，模拟做多做空。">
<!--
  训练台 落地页。

  设计约定：
  · 配色直接取自 App 的 ui/Palette.kt（深色锁定主题），页面和 App 是同一套视觉。
  · 二维码**在浏览器端按 location 实时生成**，不是预先烘死的图片 ——
    换域名 / 换路径 / 换托管商都不需要重新生成，页面本身与部署位置无关。
  · 版本 / 大小 / SHA-256 来自同目录的 meta.js（由 build.sh 生成），
    所以 APK 重新打包后跑一次 build.sh，页面上的数字不会说谎。
-->
<style>
:root{
  --bg:#0D1117; --panel:#141821; --panel-2:#1B212C;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --t1:#E9EEF6; --t2:#9AA6B8; --t3:#5F6B81;
  --gold:#E3B25C; --blue:#6EA8FE; --up:#2ED3A0; --down:#FF6B81;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;padding:36px 20px 56px;min-height:100vh;
  background:var(--bg);color:var(--t1);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* 顶部一层极淡的暖光，避免大面积纯黑显得死板 */
body::before{
  content:"";position:fixed;left:0;right:0;top:0;height:360px;pointer-events:none;
  background:radial-gradient(120% 100% at 50% 0%,rgba(227,178,92,.10),transparent 68%);
}
.wrap{position:relative;max-width:430px;margin:0 auto}

/* ── 头部 ───────────────────────────────── */
.hero{text-align:center;padding:4px 0 26px}
.icon{display:block;margin:0 auto 16px;width:76px;height:76px;
  border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
h1{margin:0;font-size:27px;font-weight:700;letter-spacing:.5px}
.tagline{margin:9px auto 0;max-width:300px;font-size:13.5px;line-height:1.7;color:var(--t2)}

/* ── 卡片 ───────────────────────────────── */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:18px;margin-bottom:14px;
}

/* ── 二维码 ─────────────────────────────── */
.qr-card{padding:20px 18px 16px;text-align:center;background:var(--panel-2)}
.qr-frame{
  display:inline-block;padding:13px;background:#fff;border-radius:14px;
  box-shadow:0 6px 22px rgba(0,0,0,.4);
}
#qr{display:block;width:186px;height:186px}
.qr-hint{margin:13px 0 0;font-size:12.5px;color:var(--t2)}
.qr-url{
  margin:8px 0 0;font-size:11px;color:var(--t3);
  word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
.qr-dead .qr-frame{display:none}
.qr-dead-msg{margin:0;font-size:13px;color:var(--t2)}
.qr-dead-msg code{background:var(--bg);padding:2px 5px;border-radius:4px;color:var(--gold)}

/* 手机上不需要扫自己的码 —— 隐藏二维码，改成一句提示 */
.mobile-note{display:none;text-align:center;font-size:13.5px;color:var(--t2);
  background:rgba(110,168,254,.08);border-color:rgba(110,168,254,.22)}
.mobile-note b{color:var(--blue)}

/* ── 下载按钮 ───────────────────────────── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;padding:16px;margin-bottom:14px;border-radius:14px;
  background:var(--gold);color:#1A1206;text-decoration:none;
  font-size:16px;font-weight:700;letter-spacing:.3px;
  box-shadow:0 6px 20px rgba(227,178,92,.22);
  transition:transform .12s ease,box-shadow .12s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 9px 26px rgba(227,178,92,.30)}
.btn:active{transform:translateY(0)}
.btn svg{flex:none}

/* ── 提示 ───────────────────────────────── */
.tip{
  display:flex;gap:9px;margin:0 0 14px;padding:12px 14px;border-radius:12px;
  background:rgba(255,107,129,.07);border:1px solid rgba(255,107,129,.20);
  font-size:12.5px;line-height:1.65;color:#F3C3CB;
}
.tip b{color:var(--down);font-weight:600}
.tip svg{flex:none;margin-top:2px}

/* ── 参数表 ─────────────────────────────── */
.facts{margin:0;padding:6px 18px}
.row{display:flex;justify-content:space-between;gap:16px;
  padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.row:last-child{border-bottom:0}
.row dt{color:var(--t2);flex:none}
.row dd{margin:0;text-align:right;font-weight:600;color:var(--t1)}
.row dd.ok{color:var(--up)}

/* ── 校验值 ─────────────────────────────── */
details.card{padding:0;overflow:hidden}
summary{padding:14px 18px;cursor:pointer;font-size:13px;color:var(--t2);
  list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"展开";font-size:11.5px;color:var(--t3)}
details[open] summary::after{content:"收起"}
.sha{margin:0;padding:0 18px 16px;font-size:11.5px;line-height:1.75;color:var(--t2);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}

footer{margin-top:24px;text-align:center;font-size:11.5px;line-height:1.8;color:var(--t3)}

/* ── 窄屏 ───────────────────────────────── */
@media (max-width:560px){
  body{padding:26px 16px 40px}
  .qr-card{display:none}
  .mobile-note{display:block}
  .icon{width:68px;height:68px;border-radius:18px}
  h1{font-size:24px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <!-- 图标来自 icon.svg（唯一来源，favicon 用的是同一个文件）—— 改图标只改那一个 -->
    <img class="icon" src="icon.svg" width="76" height="76" alt="训练台">
    <h1>训练台</h1>
    <p class="tagline">用真实历史行情练交易。逐日推进，模拟做多做空，回头看得见自己的判断对不对。</p>
  </header>

  <!-- 桌面端：扫码 -->
  <section class="card qr-card" id="qr-card">
    <div class="qr-frame">
      <svg id="qr" viewBox="0 0 29 29" role="img" aria-label="下载二维码"></svg>
    </div>
    <p class="qr-hint">用手机相机 / 浏览器扫码下载</p>
    <p class="qr-url" id="qr-url"></p>
  </section>

  <!-- 手机端：已经在手机上，不用扫 -->
  <section class="card mobile-note">
    你已经在手机上 —— 直接点下面的按钮<b>下载安装包</b>
  </section>

  <a class="btn" id="dl" href="app-release.apk" download="trader-trainer-1.0.0.apk">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 21h16"/>
    </svg>
    下载 APK
  </a>

  <p class="tip">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M12 8h.01"/><path d="M12 11v5"/>
    </svg>
    <span>在<b>微信 / QQ</b>里打开可能无法下载 —— 请点右上角「···」→「在浏览器中打开」。
    首次安装需在系统设置里允许<b>「安装未知来源应用」</b>。</span>
  </p>

  <dl class="card facts">
    <div class="row"><dt>版本</dt><dd id="f-version">1.0.0</dd></div>
    <div class="row"><dt>大小</dt><dd id="f-size">10.6 MB</dd></div>
    <div class="row"><dt>系统要求</dt><dd id="f-android">Android 8.0 及以上</dd></div>
    <div class="row"><dt>应用权限</dt><dd class="ok" id="f-perm">无 · 纯离线</dd></div>
    <div class="row"><dt>更新时间</dt><dd id="f-date">—</dd></div>
  </dl>

  <details class="card">
    <summary>文件校验值</summary>
    <p class="sha" id="f-sha">—</p>
  </details>

  <footer>
    训练台 · 仅供个人交易训练使用<br>
    不构成任何投资建议
  </footer>

</div>

<script src="meta.js"></script>
<script src="qrcode.js"></script>
<script>
(function () {
  var meta = window.APP_META || {};

  function set(id, v) {
    if (v === undefined || v === null || v === '') return;
    var el = document.getElementById(id);
    if (el) el.textContent = v;
  }

  // ── 用 APK 的真实元数据覆盖占位值 ──
  set('f-version', meta.versionName);
  set('f-size', meta.sizeText);
  set('f-date', meta.builtAt);
  set('f-sha', meta.sha256);

  // 下载文件名带上版本号，用户手机上能看出装的是哪一版
  if (meta.versionName) {
    document.getElementById('dl').setAttribute(
      'download', 'trader-trainer-' + meta.versionName + '.apk');
  }

  // ── 二维码 ──
  var card = document.getElementById('qr-card');
  var svg = document.getElementById('qr');

  // file:// 打开时 location 是个本地路径，生成出来的码扫了也没用 —— 直接说明
  if (location.protocol !== 'http:' && location.protocol !== 'https:') {
    card.classList.add('qr-dead');
    card.innerHTML = '<p class="qr-dead-msg">用 <code>http://</code> 打开本页后，' +
                     '这里会自动生成二维码。</p>';
    return;
  }

  // 去掉 query / hash：分享出去的地址要稳定
  var url = location.origin + location.pathname;

  var qr = qrcode(0, 'M');   // 0 = 自动选版本
  qr.addData(url);
  qr.make();

  var n = qr.getModuleCount();
  var d = '';
  for (var r = 0; r < n; r++) {
    for (var c = 0; c < n; c++) {
      if (qr.isDark(r, c)) d += 'M' + c + ' ' + r + 'h1v1h-1z';
    }
  }

  // 白色底板顺带当静默区（标准要求四周留 4 个模块宽）
  var pad = 4, side = n + pad * 2;
  svg.setAttribute('viewBox', (-pad) + ' ' + (-pad) + ' ' + side + ' ' + side);
  svg.innerHTML =
    '<rect x="' + (-pad) + '" y="' + (-pad) + '" width="' + side + '" height="' + side + '" fill="#fff"/>' +
    '<path d="' + d + '" fill="#0D1117" shape-rendering="crispEdges"/>';

  set('qr-url', url.replace(/^https?:\/\//, ''));
})();
</script>
</body>
</html>
